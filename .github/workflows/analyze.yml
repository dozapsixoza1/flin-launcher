name: Analyze Flinity app

on:
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download app and apktool
        run: |
          wget -nv https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar -O apktool.jar || { echo "FAILED: apktool"; exit 1; }
          wget -nv https://github.com/dozapsixoza1/silver-eureka-/releases/download/latest/Flinity_flinityRelease29.12.2025.zip -O flinity.zip || { echo "FAILED: flinity zip not found in release latest"; exit 1; }
          ls -l flinity.zip

      - name: Build apk from unpacked folder and decode
        run: |
          mkdir src
          unzip -q flinity.zip -d src
          D=$(dirname "$(find src -name AndroidManifest.xml | head -n1)")
          (cd "$D" && zip -qr "$GITHUB_WORKSPACE/app.apk" . -x "META-INF/*")
          java -jar apktool.jar d -f app.apk -o out > decode.log 2>&1 || true
          tail -n 3 decode.log

      - name: Collect key classes
        run: |
          mkdir picked
          for n in ListActivityServers MenuActivity GTASA LoadingApp InstallClient CheckFilesActivity MainStart IntallNickActivity; do
            find out -name "$n*.smali" -exec cp --parents {} picked/ \;
          done
          grep -rl "setClientIp\|ip.php\|client_launcher" out/smali* | while read f; do cp --parents "$f" picked/; done
          cp out/AndroidManifest.xml picked/
          zip -qr picked.zip picked
          ls -l picked.zip
          find picked -name "*.smali" | head -50

      - uses: actions/upload-artifact@v4
        with:
          name: picked
          path: |
            picked.zip
            decode.log
