name: Build single APK (client + launcher)

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Unpack launcher project
        run: |
          unzip -q -o flin-launcher.zip -d src_launcher
          D=$(dirname "$(find src_launcher -name settings.gradle | head -n1)")
          echo "PROJ=$PWD/$D" >> "$GITHUB_ENV"

      - name: Prepare libsamp sources
        run: |
          mkdir libsamp_build
          unzip -q "$PROJ/libsamp_src.zip" -d libsamp_build
          cd libsamp_build/src
          mv vendor/raknet vendor/RakNet
          sed -i 's|#include "CheckFileHash.h"|#include "checkfilehash.h"|' checkfilehash.cpp
          sed -i 's|^const auto encryptedAddress = .*|const char* encryptedAddress_plain = "195.18.27.226";|' main.cpp
          sed -i 's|encryptedAddress\.decrypt()|encryptedAddress_plain|' main.cpp
          sed -i 's|^unsigned short port = 7777;|unsigned short port = 3146;|' main.cpp
          cat > cheatgui.h << 'EOF'
          #pragma once
          class CCheatGUI {
          public:
              CCheatGUI() {}
              void Render() {}
              void ToggleRender() {}
              bool GetStatus() { return false; }
              void SetStatus(bool) {}
          };
          EOF
          cat > admin-bot.h << 'EOF'
          #pragma once
          class CAdminBot {
          public:
              CAdminBot() {}
              void Process() {}
          };
          EOF

      - name: Fix libtinfo for old NDK
        run: |
          sudo ln -sf /lib/x86_64-linux-gnu/libtinfo.so.6 /lib/x86_64-linux-gnu/libtinfo.so.5
          sudo ldconfig

      - name: Install NDK r17c
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r17c-linux-x86_64.zip
          unzip -q android-ndk-r17c-linux-x86_64.zip
          echo "NDK=$PWD/android-ndk-r17c" >> "$GITHUB_ENV"

      - name: Build libsamp.so
        run: |
          $NDK/ndk-build -j$(nproc) \
            NDK_PROJECT_PATH=$PWD/libsamp_build \
            APP_BUILD_SCRIPT=$PWD/libsamp_build/src/Android.mk \
            NDK_APPLICATION_MK=$PWD/libsamp_build/src/Application.mk
          ls -l libsamp_build/libs/armeabi-v7a/libsamp.so

      - name: Use FLIN project's precompiled libsamp.so
        run: |
          curl -fL --retry 3 --retry-delay 2 \
            https://raw.githubusercontent.com/dozapsixoza1/flinrp/main/libsamp.so \
            -o project-libsamp.so
          python3 - <<'PY'
          import os, struct, sys
          p = 'project-libsamp.so'
          b = open(p, 'rb').read(20)
          if len(b) < 20 or b[:4] != b'\\x7fELF' or b[4] != 1 or b[5] != 1:
              sys.exit('FLIN libsamp.so is not a 32-bit little-endian ELF')
          machine = struct.unpack_from('<H', b, 18)[0]
          if machine != 40:
              sys.exit(f'FLIN libsamp.so has wrong architecture: e_machine={machine}')
          print('Using FLIN project libsamp.so:', os.path.getsize(p), 'bytes; ARMv7')
          PY

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build launcher classes
        run: |
          cd "$PROJ"
          gradle assembleDebug --no-daemon
          cp "$(find . -name app-debug.apk | head -n1)" "$GITHUB_WORKSPACE/launcher.apk"
          ls -l "$GITHUB_WORKSPACE/launcher.apk"

      - name: Download tools and client
        run: |
          wget -q https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar -O apktool.jar
          wget -q https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar -O signer.jar
          wget -q https://github.com/dozapsixoza1/silver-eureka-/releases/download/latest/flinrp_full.apk -O client.apk
          ls -l client.apk

      - name: Decode client and launcher
        run: |
          java -jar apktool.jar d -f client.apk -o out
          java -jar apktool.jar d -f -r launcher.apk -o launcher_dec
          echo "=== libs ==="
          ls -R out/lib || true
          echo "=== sdk ==="
          grep -n "minSdkVersion\|targetSdkVersion" out/apktool.yml || true
          echo "=== who loads samp ==="
          grep -rn --include=*.smali 'const-string [a-z0-9]*, "samp"' out/smali* | head -5 || true

      - name: Embed launcher and new libsamp
        run: |
          mkdir -p out/lib/armeabi-v7a
          cp project-libsamp.so out/lib/armeabi-v7a/libsamp.so
          python3 - << 'EOF'
          import glob, os, re, shutil, sys
          import xml.etree.ElementTree as ET

          A = 'http://schemas.android.com/apk/res/android'
          mpath = 'out/AndroidManifest.xml'
          raw = open(mpath, encoding='utf-8').read()
          for pfx, uri in re.findall(r'xmlns:(\w+)="([^"]+)"', raw):
              ET.register_namespace(pfx, uri)
          ET.register_namespace('android', A)

          def q(n):
              return '{%s}%s' % (A, n)

          tree = ET.parse(mpath)
          root = tree.getroot()
          pkg = root.get('package')
          app = root.find('application')

          orig = None
          for tag in ('activity', 'activity-alias'):
              for act in app.findall(tag):
                  for f in list(act.findall('intent-filter')):
                      cats = [c.get(q('name')) for c in f.findall('category')]
                      if 'android.intent.category.LAUNCHER' in cats:
                          if orig is None:
                              n = act.get(q('name'))
                              if n.startswith('.'):
                                  n = pkg + n
                              elif '.' not in n:
                                  n = pkg + '.' + n
                              orig = n
                          act.remove(f)
          if not orig:
              sys.exit('launcher activity of the client not found')
          print('package:', pkg)
          print('original launcher activity:', orig)

          act = ET.SubElement(app, 'activity')
          act.set(q('name'), 'com.flinrp.launcher.MainActivity')
          act.set(q('exported'), 'true')
          act.set(q('theme'), '@android:style/Theme.DeviceDefault.NoActionBar.Fullscreen')
          act.set(q('screenOrientation'), 'sensorLandscape')
          act.set(q('configChanges'), 'orientation|screenSize|keyboardHidden')
          act.set(q('windowSoftInputMode'), 'adjustPan')
          f = ET.SubElement(act, 'intent-filter')
          ET.SubElement(f, 'action').set(q('name'), 'android.intent.action.MAIN')
          ET.SubElement(f, 'category').set(q('name'), 'android.intent.category.LAUNCHER')

          perms = [p.get(q('name')) for p in root.findall('uses-permission')]
          if 'android.permission.INTERNET' not in perms:
              p = ET.Element('uses-permission')
              p.set(q('name'), 'android.permission.INTERNET')
              root.insert(0, p)

          tree.write(mpath, encoding='utf-8', xml_declaration=True)

          os.makedirs('out/assets', exist_ok=True)
          open('out/assets/orig_activity.txt', 'w').write(orig)

          existing = [d for d in glob.glob('out/smali*') if os.path.isdir(d)]
          n = len(existing) + 1
          dest = 'out/smali' if n == 1 else 'out/smali_classes%d' % n
          for d in glob.glob('launcher_dec/smali*'):
              shutil.copytree(d, dest, dirs_exist_ok=True)
          print('launcher smali copied to', dest)

          smalis = glob.glob('out/smali*/**/*.smali', recursive=True)
          loads_samp = False
          for fn in smalis:
              if fn.startswith(dest):
                  continue
              if re.search(r'const-string \w+, "samp"', open(fn, encoding='utf-8').read()):
                  loads_samp = True
                  break
          print('client already loads samp:', loads_samp)
          if not loads_samp:
              pat = re.compile(r'(const-string (\w+), "GTASA"\s*\n\s*invoke-static \{\2\}, Ljava/lang/System;->loadLibrary\(Ljava/lang/String;\)V)')
              done = False
              for fn in smalis:
                  if fn.startswith(dest):
                      continue
                  s = open(fn, encoding='utf-8').read()
                  m = pat.search(s)
                  if not m:
                      continue
                  reg = m.group(2)
                  add = '\n\n    const-string %s, "samp"\n    invoke-static {%s}, Ljava/lang/System;->loadLibrary(Ljava/lang/String;)V' % (reg, reg)
                  open(fn, 'w', encoding='utf-8').write(s[:m.end()] + add + s[m.end():])
                  print('added loadLibrary(samp) in', fn)
                  done = True
                  break
              if not done:
                  print('WARNING: could not add loadLibrary(samp)')
          EOF

      - name: Fix SDK versions so new Android installs it
        run: |
          sed -i -E "s/(targetSdkVersion: )'?[0-9]+'?/\1'28'/; s/(minSdkVersion: )'?[0-9]+'?/\1'21'/" out/apktool.yml
          grep -n "minSdkVersion\|targetSdkVersion" out/apktool.yml

      - name: Build and sign
        run: |
          java -jar apktool.jar b out -o unsigned.apk
          java -jar signer.jar -a unsigned.apk --allowResign -o signed
          ls -l signed

      - uses: actions/upload-artifact@v4
        with:
          name: flin-rp-apk
          path: signed/*.apk
